<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for initials -->
  <circle cx="30" cy="30" r="25" fill="#28a745" opacity="0.1" stroke="#28a745" stroke-width="2"/>
  
  <!-- Initials TY -->
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#28a745">TY</text>
  
  <!-- Name text -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Teck</text>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#28a745">Yew</text>
  
  <!-- Decorative accent line -->
  <line x1="70" y1="48" x2="155" y2="48" stroke="#28a745" stroke-width="2"/>
</svg>